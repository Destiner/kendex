[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
vstack-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "6"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
tauri = "2"
tauri-build = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tempfile = "3"
sha2 = "0.11"
yaml-rust2 = "0.10"
fd-lock = "4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
